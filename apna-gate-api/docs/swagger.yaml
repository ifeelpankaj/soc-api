host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: 'Backend API for Society Management System. Development base URL: http://localhost:8000/api.
    Production base URL: http://localhost:8080/api.'
  license:
    name: Proprietary
  termsOfService: http://localhost:8000/terms
  title: Society Management API
  version: "1.0"
paths:
  /health:
    get:
      description: Checks if the API server is running.
      produces:
      - application/json
      responses:
        "200":
          description: API server is healthy
          schema:
            $ref: '#/definitions/models.HealthCheckResponseDoc'
      summary: Health check
      tags:
      - Health
  /health/live:
    get:
      description: Checks if the API process is alive.
      produces:
      - application/json
      responses:
        "200":
          description: API process is alive
          schema:
            $ref: '#/definitions/models.LivenessResponseDoc'
      summary: Liveness check
      tags:
      - Health
  /health/ready:
    get:
      description: Checks if the API server and database are ready.
      produces:
      - application/json
      responses:
        "200":
          description: API and database are ready
          schema:
            $ref: '#/definitions/models.ReadinessResponseDoc'
        "503":
          description: Database connection failed
          schema:
            $ref: '#/definitions/models.HealthErrorResponseDoc'
      summary: Readiness check
      tags:
      - Health
  /internal/jobs/maintenance-reminders:
    post:
      parameters:
      - description: Bearer JOB_WEBHOOK_SECRET
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/models.JobTriggerResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Queue and deliver eligible unpaid maintenance reminders
      tags:
      - Internal Jobs
  /v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the authenticated user's password after verifying the current
        password, invalidates all access and refresh sessions, then clears auth cookies.
      parameters:
      - description: Change password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            $ref: '#/definitions/models.ChangePasswordAPIResponse'
        "400":
          description: CURRENT_PASSWORD_INCORRECT, PASSWORD_NOT_SET, PASSWORD_TOO_LONG,
            mismatch, reuse, or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      security:
      - AccessToken: []
      summary: Change password
      tags:
      - Auth
  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Always returns a generic success message. If the email exists,
        sends a password reset OTP.
      parameters:
      - description: Forgot password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset instructions response
          schema:
            $ref: '#/definitions/models.ForgotPasswordAPIResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      summary: Request password reset OTP
      tags:
      - Auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a verified active user and sets access_token and
        refresh_token HTTP-only cookies.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/models.LoginAPIResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "403":
          description: Email not verified or account disabled
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      summary: Login
      tags:
      - Auth
  /v1/auth/logout:
    post:
      description: Clears access_token and refresh_token cookies. This route is public
        and succeeds even if cookies are absent.
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/models.LogoutAPIResponse'
      summary: Logout
      tags:
      - Auth
  /v1/auth/profile:
    get:
      description: Returns the authenticated user's profile. Does not refresh or rotate
        tokens.
      produces:
      - application/json
      responses:
        "200":
          description: Profile fetched successfully
          schema:
            $ref: '#/definitions/models.GetProfileAPIResponse'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      security:
      - AccessToken: []
      summary: Get current user profile
      tags:
      - Auth
    patch:
      consumes:
      - application/json
      description: Updates authenticated user profile fields such as name, phone,
        and date of birth.
      parameters:
      - description: Profile update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            $ref: '#/definitions/models.GetProfileAPIResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      security:
      - AccessToken: []
      summary: Update current user profile
      tags:
      - Auth
