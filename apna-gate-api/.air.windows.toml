# Air configuration for Windows

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = []

# Build the Go application
cmd = "go build -o ./tmp/main.exe ./cmd/server/main.go"

# Air v1.64+
entrypoint = "tmp/main.exe"

delay = 1000

exclude_dir = [
    "assets",
    "tmp",
    "vendor",
    "testdata",
    "node_modules",
    "bin",
    ".git",
    ".idea",
    ".vscode"
]

exclude_file = []
exclude_regex = ["_test\\.go"]
exclude_unchanged = false
follow_symlink = false

include_dir = []
include_ext = ["go", "tpl", "tmpl", "html", "env"]
include_file = []

kill_delay = "500ms"
log = "build-errors.log"

poll = false
poll_interval = 0

rerun = false
rerun_delay = 500

send_interrupt = false
stop_on_error = false

[color]
app = "cyan"
build = "yellow"
main = "magenta"
runner = "green"
watcher = "blue"

[log]
main_only = false
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true