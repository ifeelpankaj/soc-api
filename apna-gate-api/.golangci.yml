version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
    - unparam
  exclusions:
    presets:
      - comments

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
